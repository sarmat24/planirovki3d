<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Планировщик</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>
<style>
:root {
  --blue:#007AFF; --green:#34C759; --red:#FF3B30;
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7;
  --t1:#000; --t2:rgba(60,60,67,.6); --t3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.12); --fill:rgba(120,120,128,.16);
  --r:16px; --si-top:env(safe-area-inset-top,0px); --si-bot:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root{
  --blue:#0A84FF; --green:#30D158; --red:#FF453A;
  --bg:#000; --card:#1C1C1E; --card2:#2C2C2E;
  --t1:#fff; --t2:rgba(235,235,245,.6); --t3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24);
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  -webkit-font-smoothing:antialiased}

/* SETUP */
.setup{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;padding:24px;z-index:200}
.setup-box{background:var(--card);border-radius:28px;padding:36px 24px;width:100%;max-width:360px}
.setup-icon{font-size:56px;text-align:center;margin-bottom:16px}
.setup-title{font-size:26px;font-weight:700;text-align:center;margin-bottom:8px}
.setup-desc{font-size:14px;color:var(--t2);text-align:center;margin-bottom:28px;line-height:1.5}
.field-lbl{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.field-inp{width:100%;background:var(--fill);border:none;border-radius:12px;
  padding:13px 16px;font-size:17px;font-family:inherit;color:var(--t1);outline:none;margin-bottom:16px}
.btn-blue{width:100%;border:none;border-radius:14px;padding:15px;font-size:17px;
  font-weight:600;font-family:inherit;cursor:pointer;background:var(--blue);color:#fff}
.btn-blue:active{opacity:.85}

/* APP */
.app{position:fixed;inset:0;display:flex;flex-direction:column}

/* HEADER */
.hdr{padding:calc(var(--si-top) + 10px) 16px 10px;background:var(--card);
  border-bottom:.5px solid var(--sep);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between}
.hdr-title{font-size:17px;font-weight:600;text-align:center;flex:1}
.nav-btn{background:none;border:none;color:var(--blue);font-size:24px;padding:2px 8px;
  cursor:pointer;border-radius:8px;line-height:1;font-family:inherit}
.nav-btn:active{background:var(--fill)}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 8px}
.scroll::-webkit-scrollbar{display:none}

/* DAY SECTION */
.day-sec{margin:12px 16px 0}
.day-sec-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 4px}
.day-sec-name{font-size:15px;font-weight:700;text-transform:capitalize}
.day-today-badge{background:var(--blue);color:#fff;font-size:11px;font-weight:600;
  padding:2px 8px;border-radius:100px;letter-spacing:.3px}
.day-sec-count{margin-left:auto;font-size:13px;color:var(--t3);font-weight:500}

/* TASK LIST */
.task-list{background:var(--card);border-radius:var(--r);overflow:hidden;min-height:4px}
.task-list.drag-over{background:rgba(0,122,255,.08);outline:2px dashed var(--blue);outline-offset:-2px}
.task-row{display:flex;align-items:center;padding:11px 14px;gap:10px;
  border-bottom:.5px solid var(--sep);background:var(--card);transition:background .1s;cursor:default}
.task-row:last-child{border-bottom:none}
.task-row.sortable-ghost{opacity:.35}
.task-row.sortable-drag{background:var(--card);box-shadow:0 8px 32px rgba(0,0,0,.18);
  border-radius:12px;border-bottom:none!important}
.drag-handle{color:var(--t3);font-size:16px;cursor:grab;padding:0 2px;flex-shrink:0;
  touch-action:none;user-select:none;line-height:1}
.drag-handle:active{cursor:grabbing}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--t3);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  cursor:pointer;transition:all .2s;background:none}
.check.on{background:var(--green);border-color:var(--green)}
.check svg{opacity:0;transition:opacity .15s}
.check.on svg{opacity:1}
.task-body{flex:1;min-width:0}
.task-txt{font-size:15px;line-height:1.4;word-break:break-word}
.task-txt.done{color:var(--t3);text-decoration:line-through}
.task-time{font-size:12px;color:var(--blue);margin-top:1px;font-weight:500}
.act-btn{background:none;border:none;padding:5px 4px;border-radius:8px;cursor:pointer;
  line-height:1;font-size:15px;color:var(--t3)}
.act-btn:active{background:var(--fill)}
.act-btn.del:active{color:var(--red)}
.act-btn.edit:active{color:var(--blue)}

/* EMPTY DAY */
.day-empty{padding:14px 16px;color:var(--t3);font-size:14px;font-style:italic}

/* BOTTOM BAR */
.bar{padding:8px 16px calc(var(--si-bot) + 8px);background:var(--card);
  border-top:.5px solid var(--sep);flex-shrink:0}
.bar-days{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.bar-days::-webkit-scrollbar{display:none}
.day-chip{border:none;border-radius:100px;padding:5px 12px;font-family:inherit;
  font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0;
  background:var(--fill);color:var(--t2);transition:all .15s}
.day-chip.active{background:var(--blue);color:#fff}
.day-chip:active{opacity:.8}
.bar-row{display:flex;align-items:flex-end;gap:8px}
.inp-wrap{flex:1;background:var(--fill);border-radius:20px;padding:8px 14px}
#inp{border:none;background:none;font-family:inherit;font-size:15px;color:var(--t1);
  width:100%;resize:none;outline:none;max-height:100px;line-height:1.4}
#inp::placeholder{color:var(--t3)}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--blue);border:none;
  color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:opacity .1s}
.send-btn:active{opacity:.8}
.send-btn:disabled{opacity:.35}

/* SHEET */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;
  display:flex;align-items:flex-end;animation:fadeIn .2s}
.overlay.hidden{display:none}
.sheet{background:var(--card);border-radius:20px 20px 0 0;
  padding:20px 20px calc(var(--si-bot) + 20px);width:100%;
  animation:slideUp .25s cubic-bezier(.34,1.4,.64,1)}
.sheet-drag{width:36px;height:4px;background:var(--sep);border-radius:2px;margin:0 auto 18px}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:18px;text-align:center}
.sheet-lbl{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:6px}
.sheet-inp{width:100%;background:var(--fill);border:none;border-radius:12px;
  padding:12px 14px;font-size:16px;font-family:inherit;color:var(--t1);outline:none;margin-bottom:16px}
.sheet-inp:focus{background:var(--sep)}
.picker{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;scrollbar-width:none}
.picker::-webkit-scrollbar{display:none}
.picker-chip{border:none;border-radius:10px;padding:7px 12px;font-family:inherit;
  font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0;
  background:var(--fill);color:var(--t1)}
.picker-chip.active{background:var(--blue);color:#fff}
.sheet-btns{display:flex;gap:10px}
.sheet-btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:16px;
  font-weight:600;font-family:inherit;cursor:pointer}
.sheet-btn:active{opacity:.8}
.sheet-btn.cancel{background:var(--fill);color:var(--t1)}
.sheet-btn.save{background:var(--blue);color:#fff}
.sheet-btn.danger{background:var(--red);color:#fff}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--si-bot) + 80px);left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.82);color:#fff;padding:10px 20px;border-radius:100px;
  font-size:14px;font-weight:500;white-space:nowrap;z-index:300;
  pointer-events:none;opacity:0;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* SPIN */
.spin-wrap{padding:48px;display:flex;justify-content:center}
.spin{width:24px;height:24px;border:3px solid var(--sep);border-top-color:var(--blue);
  border-radius:50%;animation:spin .8s linear infinite}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="setup" class="hidden">
  <div class="setup-box">
    <div class="setup-icon">📋</div>
    <div class="setup-title">Планировщик</div>
    <div class="setup-desc">Открой через бота или введи Telegram ID</div>
    <div class="field-lbl">Telegram ID</div>
    <input class="field-inp" id="uidIn" type="number" placeholder="321279478"
      onkeydown="if(event.key==='Enter')doSetup()">
    <button class="btn-blue" onclick="doSetup()">Войти</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="hdr">
    <button class="nav-btn" onclick="changeWeek(-1)">‹</button>
    <span class="hdr-title" id="weekLabel"></span>
    <button class="nav-btn" onclick="changeWeek(1)">›</button>
  </div>

  <div class="scroll" id="weekView">
    <div class="spin-wrap"><div class="spin"></div></div>
  </div>

  <!-- Edit sheet -->
  <div class="overlay hidden" id="editOverlay" onclick="if(event.target===this)closeEditSheet()">
    <div class="sheet">
      <div class="sheet-drag"></div>
      <div class="sheet-title">Редактировать</div>
      <div class="sheet-lbl">Задача</div>
      <input class="sheet-inp" id="editText" type="text">
      <div class="sheet-lbl">Время</div>
      <input class="sheet-inp" id="editTime" type="time">
      <div class="sheet-lbl">День</div>
      <div class="picker" id="editPicker"></div>
      <div class="sheet-btns">
        <button class="sheet-btn cancel" onclick="closeEditSheet()">Отмена</button>
        <button class="sheet-btn save" onclick="saveEdit()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Delete sheet -->
  <div class="overlay hidden" id="delOverlay" onclick="if(event.target===this)closeDelSheet()">
    <div class="sheet">
      <div class="sheet-drag"></div>
      <div class="sheet-title">Удалить задачу?</div>
      <p style="text-align:center;color:var(--t2);font-size:14px;margin-bottom:24px" id="delText"></p>
      <div class="sheet-btns">
        <button class="sheet-btn cancel" onclick="closeDelSheet()">Отмена</button>
        <button class="sheet-btn danger" onclick="doDelete()">Удалить</button>
      </div>
    </div>
  </div>

  <div class="bar">
    <div class="bar-days" id="barDays"></div>
    <div class="bar-row">
      <div class="inp-wrap">
        <textarea id="inp" rows="1" placeholder="Добавить задачи..."
          oninput="grow(this)" onkeydown="onKey(event)"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="addTasks()">↑</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TG = window.Telegram?.WebApp;
if (TG) { TG.ready(); TG.expand(); }

const API = '/api/webapp';
let uid = null, initData = '';
let allTasks = [];
let weekMonday = getMonday(new Date());
let addDay = toISO(new Date());
let editId = null, delId = null;

// ── INIT ──
function init() {
  if (TG?.initDataUnsafe?.user?.id) {
    uid = String(TG.initDataUnsafe.user.id);
    initData = TG.initData || '';
  } else {
    uid = localStorage.getItem('tg_uid');
  }
  if (uid) { show('app'); loadWeek(); }
  else show('setup');
}

function doSetup() {
  const v = document.getElementById('uidIn').value.trim();
  if (!v || isNaN(+v)) { showToast('Введи числовой Telegram ID'); return; }
  uid = v; localStorage.setItem('tg_uid', uid);
  show('app'); loadWeek();
}
function show(id) { ['setup','app'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id)); }

// ── API ──
function apiUrl() {
  const p = new URLSearchParams();
  if (uid) p.set('uid', uid);
  return `${API}?${p}`;
}
function apiHdr() {
  const h = {'Content-Type':'application/json'};
  if (initData) h['X-Telegram-Init-Data'] = initData;
  return h;
}

// ── WEEK UTILS ──
function getMonday(d) {
  const r = new Date(d); r.setHours(0,0,0,0);
  const day = r.getDay();
  r.setDate(r.getDate()-(day===0?6:day-1));
  return r;
}
function toISO(d) { return d.toISOString().split('T')[0]; }
function weekDays(mon) {
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d;});
}
function changeWeek(dir) {
  weekMonday = new Date(weekMonday);
  weekMonday.setDate(weekMonday.getDate()+dir*7);
  loadWeek();
}

// ── LOAD ──
async function loadWeek() {
  document.getElementById('weekView').innerHTML='<div class="spin-wrap"><div class="spin"></div></div>';
  const days = weekDays(weekMonday);
  const from = toISO(days[0]), to = toISO(days[6]);
  // Week label
  const opts={day:'numeric',month:'long'};
  document.getElementById('weekLabel').textContent =
    days[0].toLocaleDateString('ru-RU',opts)+' – '+days[6].toLocaleDateString('ru-RU',{...opts,year:'numeric'});
  try {
    const r = await fetch(`${apiUrl()}&from=${from}&to=${to}`, {headers:apiHdr()});
    if (!r.ok) throw new Error(`${r.status}: ${(await r.json()).error||''}`);
    const d = await r.json();
    allTasks = d.tasks || [];
    renderWeek();
    renderBarDays();
  } catch(e) {
    document.getElementById('weekView').innerHTML =
      `<div style="padding:40px;text-align:center;color:var(--t2)">⚠️<br>${esc(e.message)}</div>`;
  }
}

// ── RENDER WEEK ──
function renderWeek() {
  const days = weekDays(weekMonday);
  const todayISO = toISO(new Date());
  const names = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];

  document.getElementById('weekView').innerHTML = days.map((d,i) => {
    const iso = toISO(d);
    const isToday = iso === todayISO;
    const dayTasks = allTasks.filter(t=>t.day===iso);
    const pending = dayTasks.filter(t=>!t.done);
    const done = dayTasks.filter(t=>t.done);
    const dateStr = d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});

    const taskRow = t => `
      <div class="task-row" data-id="${t.id}">
        <span class="drag-handle" title="Перетащить">⠿</span>
        <button class="check${t.done?' on':''}" onclick="toggleDone(${t.id},${t.done})">
          <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
            <path d="M1 4.5l3 3L10 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="task-body">
          <div class="task-txt${t.done?' done':''}">${esc(t.text)}</div>
          ${t.time?`<div class="task-time">${t.time}</div>`:''}
        </div>
        <button class="act-btn edit" onclick="openEdit(${t.id})">✎</button>
        <button class="act-btn del" onclick="openDel(${t.id})">✕</button>
      </div>`;

    return `<div class="day-sec">
      <div class="day-sec-hdr">
        <span class="day-sec-name">${names[i]}, ${dateStr}</span>
        ${isToday?'<span class="day-today-badge">сегодня</span>':''}
        ${dayTasks.length?`<span class="day-sec-count">${pending.length}/${dayTasks.length}</span>`:''}
      </div>
      <div class="task-list" data-day="${iso}" id="tl-${iso}">
        ${pending.map(taskRow).join('')}
        ${done.map(taskRow).join('')}
        ${!dayTasks.length?'<div class="day-empty">Нет задач</div>':''}
      </div>
    </div>`;
  }).join('');

  initDragDrop();

  // Scroll to today
  const todaySec = document.querySelector(`.task-list[data-day="${todayISO}"]`);
  if (todaySec) setTimeout(()=>todaySec.closest('.day-sec').scrollIntoView({behavior:'smooth',block:'start'}),100);
}

// ── DRAG & DROP ──
function initDragDrop() {
  document.querySelectorAll('.task-list').forEach(el => {
    Sortable.create(el, {
      group: 'tasks',
      animation: 180,
      delay: 150,
      delayOnTouchOnly: true,
      handle: '.drag-handle',
      ghostClass: 'sortable-ghost',
      dragClass: 'sortable-drag',
      onEnd(evt) {
        const id = parseInt(evt.item.dataset.id);
        const newDay = evt.to.dataset.day;
        const oldDay = evt.from.dataset.day;
        if (newDay && newDay !== oldDay) moveTask(id, newDay);
      }
    });
  });
}

async function moveTask(id, newDay) {
  allTasks = allTasks.map(t => t.id===id ? {...t, day:newDay} : t);
  try {
    await fetch(apiUrl(), {method:'PATCH', headers:apiHdr(), body:JSON.stringify({task_id:id,day:newDay})});
    showToast('Задача перенесена');
  } catch { showToast('Ошибка переноса'); }
  renderBarDays();
}

// ── BAR DAYS ──
function renderBarDays() {
  const days = weekDays(weekMonday);
  const names = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  document.getElementById('barDays').innerHTML = days.map((d,i) => {
    const iso = toISO(d);
    return `<button class="day-chip${iso===addDay?' active':''}" onclick="setAddDay('${iso}')">
      ${names[i]} ${d.getDate()}
    </button>`;
  }).join('');
}
function setAddDay(iso) { addDay=iso; renderBarDays(); }

// ── TOGGLE DONE ──
async function toggleDone(id, isDone) {
  if (navigator.vibrate) navigator.vibrate(8);
  allTasks = allTasks.map(t=>t.id===id?{...t,done:!isDone}:t);
  renderWeek(); renderBarDays();
  try { await fetch(apiUrl(),{method:'PATCH',headers:apiHdr(),body:JSON.stringify({task_id:id,done:!isDone})}); }
  catch { await loadWeek(); }
}

// ── EDIT ──
function openEdit(id) {
  editId = id;
  const t = allTasks.find(x=>x.id===id); if (!t) return;
  document.getElementById('editText').value = t.text;
  document.getElementById('editTime').value = t.time||'';
  const days = weekDays(weekMonday);
  const names = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  document.getElementById('editPicker').innerHTML = days.map((d,i)=>{
    const iso=toISO(d);
    return `<button class="picker-chip${iso===t.day?' active':''}"
      onclick="pickerSel(this,'editPicker')"
      data-day="${iso}">${names[i]} ${d.getDate()}</button>`;
  }).join('');
  document.getElementById('editOverlay').classList.remove('hidden');
}
function closeEditSheet() { document.getElementById('editOverlay').classList.add('hidden'); }
function pickerSel(el,pid) {
  document.querySelectorAll(`#${pid} .picker-chip`).forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
}
async function saveEdit() {
  const text = document.getElementById('editText').value.trim();
  if (!text) { showToast('Введи название'); return; }
  const time = document.getElementById('editTime').value||null;
  const dayEl = document.querySelector('#editPicker .picker-chip.active');
  const day = dayEl?.dataset.day;
  closeEditSheet();
  allTasks = allTasks.map(t=>t.id===editId?{...t,text,time,day:day||t.day}:t);
  renderWeek(); renderBarDays();
  try { await fetch(apiUrl(),{method:'PATCH',headers:apiHdr(),body:JSON.stringify({task_id:editId,text,time,day})}); }
  catch { showToast('Ошибка'); }
}

// ── DELETE ──
function openDel(id) {
  delId = id;
  const t = allTasks.find(x=>x.id===id);
  document.getElementById('delText').textContent = t?.text||'';
  document.getElementById('delOverlay').classList.remove('hidden');
}
function closeDelSheet() { document.getElementById('delOverlay').classList.add('hidden'); }
async function doDelete() {
  closeDelSheet();
  allTasks = allTasks.filter(t=>t.id!==delId);
  renderWeek(); renderBarDays();
  try { await fetch(apiUrl(),{method:'DELETE',headers:apiHdr(),body:JSON.stringify({task_id:delId})}); }
  catch { showToast('Ошибка'); }
  showToast('Удалено');
}

// ── ADD ──
async function addTasks() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim(); if (!text) return;
  inp.value=''; inp.style.height='';
  document.getElementById('sendBtn').disabled=true;
  showToast('Обрабатываю...');
  try {
    const r = await fetch(apiUrl(),{method:'POST',headers:apiHdr(),body:JSON.stringify({text,day:addDay})});
    const d = await r.json();
    showToast(d.added>0?`Добавлено: ${d.added}`:'Не распознаны задачи');
    await loadWeek();
  } catch { showToast('Ошибка'); }
  finally { document.getElementById('sendBtn').disabled=false; }
}

// ── HELPERS ──
function grow(el){el.style.height='';el.style.height=Math.min(el.scrollHeight,120)+'px';}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();addTasks();}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
let _tt;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2500);
}

init();
</script>
