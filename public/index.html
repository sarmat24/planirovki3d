<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">
<title>Планировщик</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>
<style>
:root {
  --blue:#007AFF; --green:#34C759; --red:#FF3B30;
  --bg:#F2F2F7; --card:#FFFFFF;
  --t1:#000; --t2:rgba(60,60,67,.6); --t3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.12); --fill:rgba(120,120,128,.16);
  --r:14px; --si-top:env(safe-area-inset-top,0px); --si-bot:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root{
  --blue:#0A84FF; --green:#30D158; --red:#FF453A;
  --bg:#111; --card:#1C1C1E;
  --t1:#fff; --t2:rgba(235,235,245,.6); --t3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24);
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  -webkit-font-smoothing:antialiased}

/* ── SETUP ── */
.setup{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;padding:24px;z-index:200}
.setup-box{background:var(--card);border-radius:24px;padding:40px 32px;
  width:100%;max-width:400px;box-shadow:0 8px 40px rgba(0,0,0,.12)}
.setup-icon{font-size:56px;text-align:center;margin-bottom:16px}
.setup-title{font-size:28px;font-weight:700;text-align:center;margin-bottom:6px}
.setup-sub{font-size:15px;color:var(--t2);text-align:center;margin-bottom:32px}
.lbl{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.finp{width:100%;background:var(--fill);border:none;border-radius:12px;
  padding:13px 16px;font-size:17px;font-family:inherit;color:var(--t1);outline:none;margin-bottom:8px}
.finp:focus{outline:2px solid var(--blue);outline-offset:-2px}
.hint{font-size:13px;color:var(--t3);margin-bottom:24px;line-height:1.4}
.btn-blue{width:100%;border:none;border-radius:13px;padding:15px;font-size:17px;
  font-weight:600;font-family:inherit;cursor:pointer;background:var(--blue);color:#fff;transition:opacity .1s}
.btn-blue:active{opacity:.85}

/* ── APP ── */
.app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ── HEADER ── */
.hdr{padding:calc(var(--si-top) + 10px) 16px 10px;background:var(--card);
  border-bottom:.5px solid var(--sep);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr-title{font-size:17px;font-weight:600;text-align:center;flex:1;white-space:nowrap}
.nav-btn{background:none;border:none;color:var(--blue);font-size:24px;padding:4px 10px;
  cursor:pointer;border-radius:8px;line-height:1;font-family:inherit;flex-shrink:0}
.nav-btn:active{background:var(--fill)}

/* ── MOBILE WEEK SCROLL ── */
.week-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 8px}
.week-scroll::-webkit-scrollbar{display:none}

/* ── DAY SECTION (mobile) ── */
.day-sec{margin:12px 12px 0}
.day-sec-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:0 2px}
.day-name{font-size:14px;font-weight:700}
.today-badge{background:var(--blue);color:#fff;font-size:10px;font-weight:700;
  padding:2px 7px;border-radius:100px;letter-spacing:.3px;text-transform:uppercase}
.day-count{margin-left:auto;font-size:12px;color:var(--t3);font-weight:500}

/* ── TASK LIST ── */
.task-list{background:var(--card);border-radius:var(--r);overflow:hidden;min-height:4px}
.task-list.empty-day{background:none}
.day-empty{padding:10px 14px;color:var(--t3);font-size:13px;font-style:italic}
.task-row{display:flex;align-items:center;padding:10px 12px;gap:8px;
  border-bottom:.5px solid var(--sep);background:var(--card);transition:opacity .15s;
  user-select:none;-webkit-user-select:none}
.task-row:last-child{border-bottom:none}
.task-row.sortable-ghost{opacity:.2;background:var(--fill)}
.task-row.sortable-chosen{background:var(--fill);transition:background .15s}
.task-row.sortable-drag{background:var(--card);box-shadow:0 6px 28px rgba(0,0,0,.2);
  border-radius:12px;border-bottom:none!important;opacity:1!important}

/* ── DRAG HANDLE ── */
.drag-handle{
  width:32px;height:36px;display:flex;align-items:center;justify-content:center;
  color:var(--t3);cursor:grab;touch-action:none;user-select:none;flex-shrink:0;
  font-size:17px;border-radius:8px;transition:background .1s}
.drag-handle:active{cursor:grabbing;background:var(--fill)}
@media(max-width:767px){.drag-handle{display:none}}

/* ── CHECK ── */
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--t3);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);background:none}
.check:active{transform:scale(.85)}
.check.on{background:var(--green);border-color:var(--green)}
.check svg{opacity:0;transition:opacity .15s}
.check.on svg{opacity:1}

/* ── TASK BODY ── */
.task-body{flex:1;min-width:0}
.task-txt{font-size:14px;line-height:1.35;word-break:break-word}
.task-txt.done{color:var(--t3);text-decoration:line-through}
.task-time{font-size:11px;color:var(--blue);margin-top:1px;font-weight:500}
.act-btn{background:none;border:none;padding:6px 5px;border-radius:8px;
  cursor:pointer;line-height:1;font-size:14px;color:var(--t3);flex-shrink:0}
.act-btn:active{background:var(--fill);color:var(--t1)}

/* ── MOBILE BOTTOM BAR ── */
.bar{position:fixed;bottom:0;left:0;right:0;z-index:50;
  padding:8px 12px calc(var(--si-bot) + 8px);background:var(--card);
  border-top:.5px solid var(--sep)}
/* push week content above the bar */
.week-scroll{padding-bottom:110px!important}
.bar-days{display:flex;gap:5px;overflow-x:auto;padding-bottom:7px;scrollbar-width:none}
.bar-days::-webkit-scrollbar{display:none}
.day-chip{border:none;border-radius:100px;padding:5px 11px;font-family:inherit;
  font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;
  background:var(--fill);color:var(--t2);transition:all .15s}
.day-chip.active{background:var(--blue);color:#fff}
.bar-row{display:flex;align-items:flex-end;gap:8px}
.inp-wrap{flex:1;background:var(--fill);border-radius:20px;padding:8px 14px}
#inp{border:none;background:none;font-family:inherit;font-size:15px;color:var(--t1);
  width:100%;resize:none;outline:none;max-height:100px;line-height:1.4}
#inp::placeholder{color:var(--t3)}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--blue);border:none;
  color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:opacity .1s}
.send-btn:active{opacity:.8}
.send-btn:disabled{opacity:.35}
.mic-btn{width:44px;height:44px;border-radius:50%;background:var(--fill);border:none;
  font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .15s,transform .15s;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mic-btn.recording{background:var(--red);transform:scale(1.12);animation:mic-pulse 1s ease-in-out infinite}
@keyframes mic-pulse{0%,100%{transform:scale(1.12)}50%{transform:scale(1.22)}}
.load-more-btn{display:block;width:calc(100% - 24px);margin:12px 12px 16px;
  padding:13px;background:var(--fill);border:none;border-radius:14px;
  font-size:15px;font-weight:600;font-family:inherit;color:var(--t2);cursor:pointer;
  grid-column:1/-1}
.load-more-btn:active{opacity:.7}

/* ── SHEET ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;
  display:flex;align-items:flex-end;animation:fadeIn .2s}
.overlay.hidden{display:none}
.sheet{background:var(--card);border-radius:20px 20px 0 0;
  padding:20px 20px calc(var(--si-bot) + 20px);width:100%;max-width:560px;margin:0 auto;
  animation:slideUp .25s cubic-bezier(.34,1.4,.64,1)}
.sheet-drag{width:36px;height:4px;background:var(--sep);border-radius:2px;margin:0 auto 18px}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:18px;text-align:center}
.sheet-lbl{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:6px}
.sheet-inp{width:100%;background:var(--fill);border:none;border-radius:12px;
  padding:12px 14px;font-size:16px;font-family:inherit;color:var(--t1);outline:none;margin-bottom:16px}
.sheet-inp:focus{outline:2px solid var(--blue);outline-offset:-2px}
.picker{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;scrollbar-width:none}
.picker::-webkit-scrollbar{display:none}
.picker-chip{border:none;border-radius:10px;padding:7px 12px;font-family:inherit;
  font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0;
  background:var(--fill);color:var(--t1)}
.picker-chip.active{background:var(--blue);color:#fff}
.sheet-btns{display:flex;gap:10px}
.sheet-btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:16px;
  font-weight:600;font-family:inherit;cursor:pointer}
.sheet-btn:active{opacity:.8}
.sheet-btn.cancel{background:var(--fill);color:var(--t1)}
.sheet-btn.save{background:var(--blue);color:#fff}
.sheet-btn.danger{background:var(--red);color:#fff}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--si-bot) + 80px);left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.82);color:#fff;padding:10px 20px;border-radius:100px;
  font-size:14px;font-weight:500;white-space:nowrap;z-index:300;
  pointer-events:none;opacity:0;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.spin-wrap{padding:60px;display:flex;justify-content:center}
.spin{width:24px;height:24px;border:3px solid var(--sep);border-top-color:var(--blue);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}

/* ── CALENDAR PICKER ── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav-btn{background:none;border:none;color:var(--blue);font-size:24px;
  padding:4px 12px;cursor:pointer;line-height:1;border-radius:8px}
.cal-nav-btn:active{background:var(--fill)}
.cal-nav-title{font-size:16px;font-weight:700;text-align:center;flex:1;text-transform:capitalize}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:4px}
.cal-dow span{font-size:11px;font-weight:600;color:var(--t3);padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{border:none;border-radius:9px;background:none;font-size:15px;cursor:pointer;
  color:var(--t1);padding:0;aspect-ratio:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;position:relative;font-family:inherit;
  touch-action:manipulation}
.cal-cell:active{background:var(--fill)}
.cal-cell.cal-empty{pointer-events:none}
.cal-cell.cal-today{color:var(--blue);font-weight:700}
.cal-cell.cal-sel{background:var(--blue);color:#fff;border-radius:50%}
.cal-dot{position:absolute;bottom:3px;width:4px;height:4px;
  border-radius:50%;background:var(--blue)}
.cal-cell.cal-sel .cal-dot{background:rgba(255,255,255,.8)}

/* ══════════════════════════════
   DESKTOP  (≥ 768px)
══════════════════════════════ */
@media(min-width:768px){
  .hdr{padding:16px 24px}
  .hdr-title{font-size:18px}

  /* 7-column grid, multiple rows for multi-week */
  .week-scroll{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:max-content;
    gap:10px;padding:14px;overflow-y:auto;align-items:start;padding-bottom:0!important}

  /* Each day fills its column */
  .day-sec{margin:0;display:flex;flex-direction:column;
    background:var(--card);border-radius:16px;overflow:hidden;
    max-height:calc(100vh - 160px)}

  .day-sec-hdr{padding:12px 12px 10px;border-bottom:.5px solid var(--sep);
    flex-direction:column;align-items:flex-start;gap:3px}
  .day-name{font-size:13px}
  .day-date-sub{font-size:22px;font-weight:700}

  .task-list{flex:1;overflow-y:auto;scrollbar-width:thin}
  .task-list::-webkit-scrollbar{width:3px}
  .task-list::-webkit-scrollbar-thumb{background:var(--sep);border-radius:2px}

  .task-row{padding:8px 10px;gap:6px}
  .drag-handle{width:20px;height:28px;font-size:14px;opacity:0;transition:opacity .15s}
  .task-row:hover .drag-handle{opacity:1}
  .task-txt{font-size:13px}
  .act-btn{font-size:13px;padding:4px 4px}

  .day-empty{font-size:12px;padding:10px 10px}

  /* Per-column quick-add */
  .col-add{padding:8px;border-top:.5px solid var(--sep);flex-shrink:0}
  .col-inp{width:100%;background:var(--fill);border:none;border-radius:9px;
    padding:7px 10px;font-size:13px;font-family:inherit;color:var(--t1);outline:none}
  .col-inp::placeholder{color:var(--t3)}
  .col-inp:focus{outline:1.5px solid var(--blue);outline-offset:-1.5px}

  /* Hide mobile bar on desktop */
  .bar{display:none}
  .week-scroll{padding-bottom:0!important}
}
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup" class="hidden">
  <div class="setup-box">
    <div class="setup-icon">📋</div>
    <div class="setup-title">Планировщик</div>
    <div class="setup-sub">Управляй задачами из Telegram и браузера</div>
    <div class="lbl">Telegram ID</div>
    <input class="finp" id="uidIn" type="number" placeholder="321279478"
      onkeydown="if(event.key==='Enter')doSetup()">
    <p class="hint">Чтобы узнать свой ID — напиши <strong>/myid</strong> боту @planirovki3d_bot</p>
    <button class="btn-blue" onclick="doSetup()">Войти</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="hdr">
    <button class="nav-btn" onclick="changeWeek(-1)">‹</button>
    <span class="hdr-title" id="weekLabel" onclick="openCalendar()" style="cursor:pointer"></span>
    <button class="nav-btn" onclick="openCalendar()">📅</button>
    <button class="nav-btn" onclick="changeWeek(1)">›</button>
  </div>

  <div class="week-scroll" id="weekView">
    <div class="spin-wrap"><div class="spin"></div></div>
  </div>

  <!-- Edit sheet -->
  <div class="overlay hidden" id="editOverlay" onclick="if(event.target===this)closeEdit()">
    <div class="sheet">
      <div class="sheet-drag"></div>
      <div class="sheet-title">Редактировать задачу</div>
      <div class="sheet-lbl">Название</div>
      <input class="sheet-inp" id="editText" type="text">
      <div class="sheet-lbl">Время (необязательно)</div>
      <input class="sheet-inp" id="editTime" type="time">
      <div class="sheet-lbl">День</div>
      <div class="picker" id="editPicker"></div>
      <div class="sheet-btns">
        <button class="sheet-btn cancel" onclick="closeEdit()">Отмена</button>
        <button class="sheet-btn save" onclick="saveEdit()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Native date picker (hidden) -->
  <input type="date" id="datePicker" style="position:fixed;opacity:0;pointer-events:none;top:0;left:0;width:1px;height:1px"
    onchange="jumpToDate(this.value)">

  <!-- Delete sheet -->
  <div class="overlay hidden" id="delOverlay" onclick="if(event.target===this)closeDelete()">
    <div class="sheet">
      <div class="sheet-drag"></div>
      <div class="sheet-title">Удалить задачу?</div>
      <p style="text-align:center;color:var(--t2);font-size:14px;margin-bottom:24px" id="delText"></p>
      <div class="sheet-btns">
        <button class="sheet-btn cancel" onclick="closeDelete()">Отмена</button>
        <button class="sheet-btn danger" onclick="doDelete()">Удалить</button>
      </div>
    </div>
  </div>

  <!-- Mobile bottom bar -->
  <div class="bar">
    <div class="bar-days" id="barDays"></div>
    <div class="bar-row">
      <div class="inp-wrap">
        <textarea id="inp" rows="1" placeholder="Добавить задачи..."
          oninput="grow(this)" onkeydown="onKey(event)"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="addTasks(addDay)">↑</button>
      <button class="mic-btn" id="micBtn" title="Держи для записи">🎤</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TG = window.Telegram?.WebApp;
if (TG) { TG.ready(); TG.expand(); }

const API = '/api/webapp';
const VOICE_API = '/api/voice';
let uid = null, initData = '';
let allTasks = [];
let weekMonday = getMonday(new Date());
let addDay = toISO(new Date());
let editId = null, delId = null;
let mobileWeeks = 4;
let mediaRecorder = null, audioChunks = [], isRecording = false, micStream = null;

// ── INIT ──
function init() {
  if (TG?.initDataUnsafe?.user?.id) {
    uid = String(TG.initDataUnsafe.user.id);
    initData = TG.initData || '';
  } else {
    uid = localStorage.getItem('tg_uid');
  }
  if (uid) { show('app'); loadWeek(); initMicPermission(); }
  else show('setup');
  setupMic();
}

function doSetup() {
  const v = document.getElementById('uidIn').value.trim();
  if (!v || isNaN(+v)) { showToast('Введи числовой Telegram ID'); return; }
  uid = v; localStorage.setItem('tg_uid', uid);
  show('app'); loadWeek();
}
function show(id) {
  ['setup','app'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));
}

// ── API ──
function apiUrl() {
  const p = new URLSearchParams();
  if (uid) p.set('uid', uid);
  return `${API}?${p}`;
}
function apiHdr() {
  const h = {'Content-Type':'application/json'};
  if (initData) h['X-Telegram-Init-Data'] = initData;
  return h;
}

// ── WEEK UTILS ──
function getMonday(d) {
  const r = new Date(d); r.setHours(0,0,0,0);
  const day = r.getDay();
  r.setDate(r.getDate()-(day===0?6:day-1));
  return r;
}
function toISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function weekDays(mon, count) {
  const n = count ?? mobileWeeks * 7;
  return Array.from({length:n},(_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d;});
}

function changeWeek(dir) {
  weekMonday = new Date(weekMonday);
  weekMonday.setDate(weekMonday.getDate() + dir * 7);
  loadWeek();
}

// ── LOAD ──
async function loadWeek() {
  document.getElementById('weekView').innerHTML='<div class="spin-wrap"><div class="spin"></div></div>';
  const days = weekDays(weekMonday);
  const from = toISO(days[0]), to = toISO(days[days.length-1]);

  const opts = {day:'numeric',month:'long'};
  document.getElementById('weekLabel').textContent =
    days[0].toLocaleDateString('ru-RU',opts)+' – '+days[days.length-1].toLocaleDateString('ru-RU',{...opts,year:'numeric'});

  try {
    const r = await fetch(`${apiUrl()}&from=${from}&to=${to}`, {headers:apiHdr()});
    if (!r.ok) throw new Error(`${r.status}: ${(await r.json()).error||'Ошибка'}`);
    const d = await r.json();
    allTasks = d.tasks || [];
    renderWeek();
    renderBarDays();
  } catch(e) {
    document.getElementById('weekView').innerHTML =
      `<div style="padding:48px;text-align:center;color:var(--t2)">
        <div style="font-size:36px;margin-bottom:12px">⚠️</div>
        <div style="font-weight:600;margin-bottom:6px">Ошибка загрузки</div>
        <div style="font-size:13px">${esc(e.message)}</div>
      </div>`;
  }
}

// ── RENDER ──
// getDay(): 0=Вс,1=Пн,2=Вт,3=Ср,4=Чт,5=Пт,6=Сб
const _dn  = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const _dns = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
function dayName(d)  { return _dn[d.getDay()]; }
function dayNameS(d) { return _dns[d.getDay()]; }

function taskHtml(t) {
  return `<div class="task-row" data-id="${t.id}">
    <span class="drag-handle" title="Перетащить">⠿</span>
    <button class="check${t.done?' on':''}" onclick="toggleDone(${t.id},${t.done})">
      <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
        <path d="M1 4.5l3 3L10 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="task-body">
      <div class="task-txt${t.done?' done':''}">${esc(t.text)}</div>
      ${t.time?`<div class="task-time">${t.time}</div>`:''}
    </div>
    <button class="act-btn" onclick="openEdit(${t.id})" title="Редактировать">✎</button>
    <button class="act-btn" onclick="openDelete(${t.id})" title="Удалить" style="color:var(--t3)">✕</button>
  </div>`;
}

function renderWeek() {
  const days = weekDays(weekMonday);
  const todayISO = toISO(new Date());
  const isDesktop = window.innerWidth >= 768;

  document.getElementById('weekView').innerHTML = days.map((d,i) => {
    const iso = toISO(d);
    const isToday = iso === todayISO;
    const dayTasks = allTasks.filter(t=>t.day===iso);
    const pending = dayTasks.filter(t=>!t.done);
    const done = dayTasks.filter(t=>t.done);
    const dateStr = d.toLocaleDateString('ru-RU',{day:'numeric',month:isDesktop?'short':'long'});

    const hdr = isDesktop
      ? `<div class="day-sec-hdr">
           <span class="day-name">${dayNameS(d)}${isToday?' <span class="today-badge">сегодня</span>':''}</span>
           <span class="day-date-sub">${d.getDate()}</span>
         </div>`
      : `<div class="day-sec-hdr">
           <span class="day-name">${dayName(d)}, ${dateStr}</span>
           ${isToday?'<span class="today-badge">сегодня</span>':''}
           ${dayTasks.length?`<span class="day-count">${pending.length}/${dayTasks.length}</span>`:''}
         </div>`;

    const colAdd = isDesktop
      ? `<div class="col-add">
           <input class="col-inp" placeholder="+ задача..." data-day="${iso}"
             onkeydown="colAddKey(event,'${iso}')" type="text">
         </div>`
      : '';

    return `<div class="day-sec${isToday?' day-today':''}">
      ${hdr}
      <div class="task-list${!dayTasks.length?' empty-day':''}" data-day="${iso}" id="tl-${iso}">
        ${[...pending,...done].map(taskHtml).join('')}
        ${!dayTasks.length?'<div class="day-empty">Нет задач</div>':''}
      </div>
      ${colAdd}
    </div>`;
  }).join('');

  document.getElementById('weekView').insertAdjacentHTML('beforeend',
    `<button class="load-more-btn" onclick="loadMoreWeeks()">Загрузить ещё →</button>`);

  initDragDrop();

  // Scroll to today
  const elToday = document.getElementById(`tl-${todayISO}`);
  if (elToday) setTimeout(()=>elToday.closest('.day-sec').scrollIntoView({behavior:'smooth',block:'start'}),150);
}

async function loadMoreWeeks() {
  mobileWeeks += 2;
  await loadWeek();
}

// ── DRAG & DROP ──
let _sortables = [];
function initDragDrop() {
  _sortables.forEach(s => { try { s.destroy(); } catch {} });
  _sortables = [];
  const isDesktop = window.innerWidth >= 768;
  document.querySelectorAll('.task-list').forEach(el => {
    _sortables.push(Sortable.create(el, {
      group: 'tasks',
      animation: 200,
      delay: isDesktop ? 0 : 400,
      delayOnTouchOnly: true,
      touchStartThreshold: 3,
      handle: isDesktop ? '.drag-handle' : undefined,
      filter: '.check,.act-btn',
      preventOnFilter: true,
      ghostClass: 'sortable-ghost',
      dragClass: 'sortable-drag',
      chosenClass: 'sortable-chosen',
      onEnd(evt) {
        const id = parseInt(evt.item.dataset.id);
        const newDay = evt.to.dataset.day;
        const oldDay = evt.from.dataset.day;
        if (newDay && newDay !== oldDay) moveTask(id, newDay);
      }
    }));
  });
}

async function moveTask(id, newDay) {
  allTasks = allTasks.map(t=>t.id===id?{...t,day:newDay}:t);
  renderBarDays();
  try {
    await fetch(apiUrl(),{method:'PATCH',headers:apiHdr(),body:JSON.stringify({task_id:id,day:newDay})});
    showToast('Задача перенесена');
  } catch { showToast('Ошибка переноса'); await loadWeek(); }
}

// ── BAR DAYS (mobile) ──
function renderBarDays() {
  const days = weekDays(weekMonday, 7);
  document.getElementById('barDays').innerHTML = days.map(d => {
    const iso = toISO(d);
    return `<button class="day-chip${iso===addDay?' active':''}" onclick="setAddDay('${iso}')">
      ${dayNameS(d)} ${d.getDate()}
    </button>`;
  }).join('');
}
function setAddDay(iso) { addDay=iso; renderBarDays(); }

// ── TOGGLE DONE ──
async function toggleDone(id, isDone) {
  if (navigator.vibrate) navigator.vibrate(8);
  allTasks = allTasks.map(t=>t.id===id?{...t,done:!isDone}:t);
  renderWeek(); renderBarDays();
  try { await fetch(apiUrl(),{method:'PATCH',headers:apiHdr(),body:JSON.stringify({task_id:id,done:!isDone})}); }
  catch { await loadWeek(); }
}

// ── EDIT ──
function openEdit(id) {
  editId = id;
  const t = allTasks.find(x=>x.id===id); if(!t) return;
  document.getElementById('editText').value = t.text;
  document.getElementById('editTime').value = t.time||'';
  const days = weekDays(weekMonday, 7);
  document.getElementById('editPicker').innerHTML = days.map(d=>{
    const iso=toISO(d);
    return `<button class="picker-chip${iso===t.day?' active':''}"
      onclick="pickerSel(this,'editPicker')" data-day="${iso}">
      ${dayNameS(d)} ${d.getDate()}</button>`;
  }).join('');
  document.getElementById('editOverlay').classList.remove('hidden');
  setTimeout(()=>document.getElementById('editText').focus(),100);
}
function closeEdit(){ document.getElementById('editOverlay').classList.add('hidden'); }
function pickerSel(el,pid){
  document.querySelectorAll(`#${pid} .picker-chip`).forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
}
async function saveEdit(){
  const text = document.getElementById('editText').value.trim();
  if(!text){showToast('Введи название');return;}
  const time = document.getElementById('editTime').value||null;
  const dayEl = document.querySelector('#editPicker .picker-chip.active');
  const day = dayEl?.dataset.day;
  closeEdit();
  allTasks = allTasks.map(t=>t.id===editId?{...t,text,time,day:day||t.day}:t);
  renderWeek(); renderBarDays();
  try{ await fetch(apiUrl(),{method:'PATCH',headers:apiHdr(),body:JSON.stringify({task_id:editId,text,time,day})}); }
  catch{ showToast('Ошибка'); }
}

// ── DELETE ──
function openDelete(id){
  delId=id;
  const t=allTasks.find(x=>x.id===id);
  document.getElementById('delText').textContent=t?.text||'';
  document.getElementById('delOverlay').classList.remove('hidden');
}
function closeDelete(){ document.getElementById('delOverlay').classList.add('hidden'); }
async function doDelete(){
  closeDelete();
  allTasks=allTasks.filter(t=>t.id!==delId);
  renderWeek(); renderBarDays();
  try{ await fetch(apiUrl(),{method:'DELETE',headers:apiHdr(),body:JSON.stringify({task_id:delId})}); }
  catch{ showToast('Ошибка'); }
  showToast('Удалено');
}

// ── ADD (mobile bottom bar) ──
async function addTasks(day) {
  const inp = document.getElementById('inp');
  const text = inp.value.trim(); if(!text) return;
  inp.value=''; inp.style.height='';
  document.getElementById('sendBtn').disabled=true;
  showToast('Обрабатываю...');
  try {
    const r = await fetch(apiUrl(),{method:'POST',headers:apiHdr(),body:JSON.stringify({text,day})});
    const d = await r.json();
    showToast(d.added>0?`Добавлено: ${d.added}`:'Не распознаны задачи');
    await loadWeek();
  } catch { showToast('Ошибка'); }
  finally { document.getElementById('sendBtn').disabled=false; }
}

// ── ADD (desktop per-column) ──
async function colAddKey(e, day) {
  if(e.key!=='Enter') return;
  const inp = e.target;
  const text = inp.value.trim(); if(!text) return;
  inp.value=''; inp.disabled=true;
  try {
    await fetch(apiUrl(),{method:'POST',headers:apiHdr(),body:JSON.stringify({text,day})});
    await loadWeek();
  } catch { showToast('Ошибка'); }
  finally { inp.disabled=false; inp.focus(); }
}

// ── DATE PICKER ──
function openCalendar() {
  const inp = document.getElementById('datePicker');
  inp.value = addDay;
  try { inp.showPicker(); } catch { inp.click(); }
}

function jumpToDate(iso) {
  if (!iso) return;
  addDay = iso;
  weekMonday = getMonday(new Date(iso + 'T12:00:00'));
  mobileWeeks = 4;
  loadWeek().then(() => {
    setTimeout(() => {
      const el = document.getElementById('tl-' + iso);
      if (el) el.closest('.day-sec')?.scrollIntoView({behavior:'smooth', block:'start'});
    }, 300);
  });
}

// ── VOICE RECORDING ──
async function initMicPermission() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch { /* пользователь не разрешил — покажем ошибку при первом нажатии */ }
}

function setupMic() {
  const btn = document.getElementById('micBtn');
  if (!btn) return;

  btn.addEventListener('contextmenu', e => e.preventDefault());

  const startRec = async (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (isRecording) return;
    try {
      if (!micStream || micStream.getTracks().some(t => t.readyState === 'ended')) {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      }
      mediaRecorder = new MediaRecorder(micStream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e2 => { if (e2.data.size > 0) audioChunks.push(e2.data); };
      mediaRecorder.onstop = sendVoice;
      mediaRecorder.start();
      isRecording = true;
      btn.textContent = '🔴'; btn.classList.add('recording');
      if (navigator.vibrate) navigator.vibrate(40);
    } catch { showToast('Нет доступа к микрофону'); }
  };

  const stopRec = (e) => {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!isRecording || !mediaRecorder) return;
    mediaRecorder.stop();
    isRecording = false;
    btn.textContent = '🎤'; btn.classList.remove('recording');
  };

  btn.addEventListener('touchstart', startRec, { passive: false });
  btn.addEventListener('touchend',   stopRec,  { passive: false });
  btn.addEventListener('touchcancel',stopRec,  { passive: false });
  btn.addEventListener('mousedown',  startRec);
  btn.addEventListener('mouseup',    stopRec);
  btn.addEventListener('mouseleave', stopRec);
}

async function sendVoice() {
  const mimeType = mediaRecorder.mimeType || 'audio/webm';
  const blob = new Blob(audioChunks, { type: mimeType });
  if (blob.size < 1000) { showToast('Слишком короткое сообщение'); return; }
  showToast('Обрабатываю...');
  const reader = new FileReader();
  reader.onload = async () => {
    const base64 = reader.result.split(',')[1];
    const p = new URLSearchParams(); if (uid) p.set('uid', uid);
    // Pass all visible tasks as context for management commands
    const context_tasks = allTasks.map(t => ({ id: t.id, text: t.text, done: t.done, day: t.day }));
    try {
      const r = await fetch(`${VOICE_API}?${p}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...apiHdr() },
        body: JSON.stringify({ audio_base64: base64, mime_type: mimeType, day: addDay, context_tasks })
      });
      const d = await r.json();
      if (d.type === 'new_tasks') {
        showToast(d.added > 0 ? `✅ ${d.transcribed}` : `Не распознаны задачи`);
        if (d.added > 0) await loadWeek();
      } else if (d.type === 'manage') {
        showToast(d.results?.join('\n') || '✅ Готово');
        await loadWeek();
      } else {
        showToast('Не распознано. Попробуй ещё раз.');
      }
    } catch { showToast('Ошибка. Попробуй ещё раз.'); }
  };
  reader.readAsDataURL(blob);
}

// ── HELPERS ──
function grow(el){el.style.height='';el.style.height=Math.min(el.scrollHeight,120)+'px';}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();addTasks(addDay);}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

let _tt;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('show'),2500);
}

// Re-render on resize (switch mobile↔desktop layout)
let _rz;
window.addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{if(allTasks.length||true)renderWeek();},200);});

init();
</script>
