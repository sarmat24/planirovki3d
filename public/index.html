<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Планировщик</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --purple:#AF52DE;
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7;
  --t1:#000; --t2:rgba(60,60,67,.6); --t3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.12); --fill:rgba(120,120,128,.16);
  --r:16px; --r2:12px; --r3:10px;
  --si-top:env(safe-area-inset-top,0px); --si-bot:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root{
  --blue:#0A84FF; --green:#30D158; --red:#FF453A;
  --bg:#000; --card:#1C1C1E; --card2:#2C2C2E;
  --t1:#fff; --t2:rgba(235,235,245,.6); --t3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24);
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  -webkit-font-smoothing:antialiased}

/* ── SETUP ── */
.setup{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;padding:24px;z-index:200}
.setup-box{background:var(--card);border-radius:28px;padding:36px 24px;width:100%;max-width:360px}
.setup-icon{font-size:56px;text-align:center;margin-bottom:16px}
.setup-title{font-size:26px;font-weight:700;text-align:center;margin-bottom:8px}
.setup-desc{font-size:14px;color:var(--t2);text-align:center;margin-bottom:28px;line-height:1.5}
.field-label{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;
  letter-spacing:.7px;margin-bottom:6px}
.field-input{width:100%;background:var(--fill);border:none;border-radius:var(--r2);
  padding:13px 16px;font-size:17px;font-family:inherit;color:var(--t1);outline:none;
  margin-bottom:16px;transition:background .15s}
.field-input:focus{background:var(--sep)}
.btn-main{width:100%;border:none;border-radius:14px;padding:15px;font-size:17px;
  font-weight:600;font-family:inherit;cursor:pointer;background:var(--blue);color:#fff;
  transition:opacity .1s,transform .1s}
.btn-main:active{opacity:.85;transform:scale(.98)}

/* ── APP ── */
.app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ── HEADER ── */
.hdr{padding:calc(var(--si-top) + 10px) 16px 0;background:var(--card);
  border-bottom:.5px solid var(--sep);flex-shrink:0}
.hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hdr-title{font-size:17px;font-weight:600;text-align:center;flex:1}
.nav-btn{background:none;border:none;color:var(--blue);font-size:22px;font-weight:400;
  padding:4px 10px;cursor:pointer;border-radius:8px;line-height:1;font-family:inherit}
.nav-btn:active{background:var(--fill)}

/* ── DAY STRIP ── */
.days-strip{display:flex;overflow-x:auto;scrollbar-width:none;
  padding:0 8px 12px;gap:2px;background:var(--card)}
.days-strip::-webkit-scrollbar{display:none}
.day-tab{display:flex;flex-direction:column;align-items:center;
  min-width:42px;padding:6px 4px 8px;border-radius:12px;cursor:pointer;
  border:none;background:none;color:var(--t2);transition:background .15s;font-family:inherit}
.day-tab:active{background:var(--fill)}
.day-tab .dname{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.day-tab .dnum{font-size:20px;font-weight:600;margin-top:3px;width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;border-radius:50%}
.day-tab.today .dnum{background:var(--fill)}
.day-tab.selected .dnum{background:var(--blue);color:#fff}
.day-tab.selected{color:var(--t1)}
.day-tab.today.selected .dnum{background:var(--blue);color:#fff}
.has-tasks-dot{width:5px;height:5px;border-radius:50%;background:var(--blue);
  margin-top:3px;opacity:.7}
.day-tab.selected .has-tasks-dot{background:#fff}

/* ── SCROLL ── */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px}
.scroll::-webkit-scrollbar{display:none}

/* ── DAY HEADER ── */
.day-header{padding:16px 0 10px;display:flex;align-items:center;justify-content:space-between}
.day-header-title{font-size:15px;font-weight:600;color:var(--t2);text-transform:capitalize}

/* ── TASK LIST ── */
.task-list{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.task-row{display:flex;align-items:center;padding:12px 16px;gap:12px;
  border-bottom:.5px solid var(--sep);cursor:default;transition:background .1s}
.task-row:last-child{border-bottom:none}
.task-row:active{background:var(--fill)}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--t3);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  cursor:pointer;transition:all .2s;background:none}
.check:active{transform:scale(.85)}
.check.on{background:var(--green);border-color:var(--green)}
.check svg{opacity:0;transition:opacity .15s}
.check.on svg{opacity:1}
.task-body{flex:1;min-width:0}
.task-txt{font-size:16px;line-height:1.4;word-break:break-word}
.task-txt.done{color:var(--t3);text-decoration:line-through}
.task-time{font-size:12px;color:var(--blue);margin-top:2px;font-weight:500}
.task-actions{display:flex;gap:4px;flex-shrink:0}
.act-btn{background:none;border:none;color:var(--t3);font-size:16px;padding:4px 6px;
  border-radius:8px;cursor:pointer;transition:color .15s,background .15s;line-height:1}
.act-btn:active{background:var(--fill)}
.act-btn.edit:active,.act-btn.edit:hover{color:var(--blue)}
.act-btn.del:active,.act-btn.del:hover{color:var(--red)}

/* ── EMPTY ── */
.empty{padding:48px 16px;text-align:center}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-title{font-size:17px;font-weight:600;margin-bottom:6px}
.empty-sub{font-size:14px;color:var(--t2);line-height:1.5}

/* ── BOTTOM BAR ── */
.bar{padding:8px 16px calc(var(--si-bot) + 8px);background:var(--card);
  border-top:.5px solid var(--sep);display:flex;align-items:flex-end;gap:8px;flex-shrink:0}
.inp-wrap{flex:1;background:var(--fill);border-radius:20px;padding:8px 14px;
  display:flex;align-items:flex-end}
#inp{border:none;background:none;font-family:inherit;font-size:15px;color:var(--t1);
  width:100%;resize:none;outline:none;max-height:100px;line-height:1.4}
#inp::placeholder{color:var(--t3)}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--blue);border:none;
  color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:opacity .1s,transform .1s}
.send-btn:active{opacity:.8;transform:scale(.92)}
.send-btn:disabled{opacity:.35}

/* ── SHEET (bottom modal) ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;
  display:flex;align-items:flex-end;animation:fadeIn .2s}
.overlay.hidden{display:none}
.sheet{background:var(--card);border-radius:20px 20px 0 0;padding:20px 20px calc(var(--si-bot) + 20px);
  width:100%;animation:slideUp .3s cubic-bezier(.34,1.56,.64,1)}
.sheet-drag{width:36px;height:4px;background:var(--sep);border-radius:2px;
  margin:0 auto 20px}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:20px;text-align:center}
.sheet-label{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:6px}
.sheet-input{width:100%;background:var(--fill);border:none;border-radius:var(--r2);
  padding:12px 14px;font-size:16px;font-family:inherit;color:var(--t1);outline:none;
  margin-bottom:16px}
.sheet-input:focus{background:var(--sep)}
.day-picker{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;
  scrollbar-width:none}
.day-picker::-webkit-scrollbar{display:none}
.day-chip{border:none;border-radius:10px;padding:8px 12px;font-family:inherit;
  font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  background:var(--fill);color:var(--t1);transition:all .15s;flex-shrink:0}
.day-chip.active{background:var(--blue);color:#fff}
.day-chip:active{opacity:.8}
.sheet-btns{display:flex;gap:10px}
.sheet-btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:16px;
  font-weight:600;font-family:inherit;cursor:pointer;transition:opacity .1s}
.sheet-btn:active{opacity:.8}
.sheet-btn.cancel{background:var(--fill);color:var(--t1)}
.sheet-btn.save{background:var(--blue);color:#fff}
.sheet-btn.danger{background:var(--red);color:#fff}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--si-bot) + 80px);left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:100px;
  font-size:14px;font-weight:500;white-space:nowrap;z-index:300;
  transition:opacity .3s,transform .3s;pointer-events:none;opacity:0}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

.hidden{display:none!important}
.spin{width:24px;height:24px;border:3px solid var(--sep);border-top-color:var(--blue);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
.spin-wrap{padding:48px;display:flex;justify-content:center}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- Setup fallback (when not in Telegram) -->
<div id="setup" class="hidden">
  <div class="setup-box">
    <div class="setup-icon">📋</div>
    <div class="setup-title">Планировщик</div>
    <div class="setup-desc">Открой через бота в Telegram или введи свой ID для входа</div>
    <div class="field-label">Telegram ID</div>
    <input class="field-input" id="uidIn" type="number" placeholder="321279478"
      onkeydown="if(event.key==='Enter') doSetup()">
    <button class="btn-main" onclick="doSetup()">Войти</button>
  </div>
</div>

<!-- Main app -->
<div id="app" class="hidden">
  <div class="hdr">
    <div class="hdr-row">
      <button class="nav-btn" onclick="changeWeek(-1)">‹</button>
      <span class="hdr-title" id="weekLabel"></span>
      <button class="nav-btn" onclick="changeWeek(1)">›</button>
    </div>
    <div class="days-strip" id="daysStrip"></div>
  </div>

  <div class="scroll">
    <div id="taskWrap"></div>
  </div>

  <!-- Edit sheet -->
  <div class="overlay hidden" id="editOverlay" onclick="closeEdit(event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-drag"></div>
      <div class="sheet-title">Редактировать</div>
      <div class="sheet-label">Задача</div>
      <input class="sheet-input" id="editText" type="text" placeholder="Название задачи">
      <div class="sheet-label">Время (необязательно)</div>
      <input class="sheet-input" id="editTime" type="time">
      <div class="sheet-label">Перенести на день</div>
      <div class="day-picker" id="editDayPicker"></div>
      <div class="sheet-btns">
        <button class="sheet-btn cancel" onclick="document.getElementById('editOverlay').classList.add('hidden')">Отмена</button>
        <button class="sheet-btn save" onclick="saveEdit()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Delete sheet -->
  <div class="overlay hidden" id="deleteOverlay" onclick="closeDelete(event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-drag"></div>
      <div class="sheet-title">Удалить задачу?</div>
      <div style="color:var(--t2);font-size:14px;text-align:center;margin-bottom:24px" id="deleteTaskText"></div>
      <div class="sheet-btns">
        <button class="sheet-btn cancel" onclick="document.getElementById('deleteOverlay').classList.add('hidden')">Отмена</button>
        <button class="sheet-btn danger" onclick="confirmDelete()">Удалить</button>
      </div>
    </div>
  </div>

  <div class="bar">
    <div class="inp-wrap">
      <textarea id="inp" rows="1" placeholder="Добавить задачи..." oninput="grow(this)" onkeydown="onKey(event)"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="addTasks()">↑</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TG = window.Telegram?.WebApp;
if (TG) { TG.ready(); TG.expand(); }

const API = '/api/webapp';
let uid = null, initData = '';
let allTasks = [];
let selectedDay = toISO(new Date());
let weekMonday = getMonday(new Date());
let editingId = null, deletingId = null;

// ── INIT ──
function init() {
  if (TG?.initDataUnsafe?.user?.id) {
    uid = TG.initDataUnsafe.user.id;
    initData = TG.initData || '';
    show('app');
  } else {
    const saved = localStorage.getItem('tg_uid');
    if (saved) { uid = saved; show('app'); }
    else { show('setup'); return; }
  }
  renderWeekStrip();
  loadWeek();
}

function doSetup() {
  const v = document.getElementById('uidIn').value.trim();
  if (!v || isNaN(+v)) { showToast('Введи числовой Telegram ID'); return; }
  uid = v;
  localStorage.setItem('tg_uid', uid);
  show('app');
  renderWeekStrip();
  loadWeek();
}

function show(id) {
  ['setup','app'].forEach(x => document.getElementById(x).classList.toggle('hidden', x !== id));
}

// ── API ──
function apiUrl(extra = '') {
  const p = new URLSearchParams();
  if (!initData && uid) p.set('uid', String(uid));
  return `${API}${extra}?${p}`;
}

function apiHeaders() {
  const h = { 'Content-Type': 'application/json' };
  if (initData) h['X-Telegram-Init-Data'] = initData;
  return h;
}

// ── WEEK ──
function getMonday(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return d;
}

function toISO(date) {
  return date.toISOString().split('T')[0];
}

function weekEnd(monday) {
  const d = new Date(monday);
  d.setDate(d.getDate() + 6);
  return d;
}

function weekDays(monday) {
  return Array.from({length:7}, (_, i) => {
    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    return d;
  });
}

function changeWeek(dir) {
  weekMonday = new Date(weekMonday);
  weekMonday.setDate(weekMonday.getDate() + dir * 7);
  // If new week contains today, select today; otherwise first day of week
  const todayISO = toISO(new Date());
  const days = weekDays(weekMonday).map(toISO);
  selectedDay = days.includes(todayISO) ? todayISO : days[0];
  renderWeekStrip();
  loadWeek();
}

function renderWeekStrip() {
  const days = weekDays(weekMonday);
  const todayISO = toISO(new Date());
  const names = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

  // Week label
  const from = days[0], to = days[6];
  const opts = {day:'numeric',month:'long'};
  const fromStr = from.toLocaleDateString('ru-RU', opts);
  const toStr = to.toLocaleDateString('ru-RU', {day:'numeric',month:'long',year:'numeric'});
  document.getElementById('weekLabel').textContent = `${fromStr} – ${toStr}`;

  // Day tabs
  const strip = document.getElementById('daysStrip');
  strip.innerHTML = days.map((d, i) => {
    const iso = toISO(d);
    const isToday = iso === todayISO;
    const isSel = iso === selectedDay;
    const hasTasks = allTasks.some(t => t.day === iso);
    return `<button class="day-tab${isToday?' today':''}${isSel?' selected':''}"
      onclick="selectDay('${iso}')">
      <span class="dname">${names[i]}</span>
      <span class="dnum">${d.getDate()}</span>
      <span class="has-tasks-dot${hasTasks?' ':'hidden '}"></span>
    </button>`;
  }).join('');

  // Scroll selected day into view
  requestAnimationFrame(() => {
    const tabs = strip.querySelectorAll('.day-tab');
    const selIdx = days.findIndex(d => toISO(d) === selectedDay);
    if (tabs[selIdx]) tabs[selIdx].scrollIntoView({block:'nearest',inline:'center'});
  });
}

function selectDay(iso) {
  selectedDay = iso;
  renderWeekStrip();
  renderTasks();
  document.querySelector('.scroll')?.scrollTo(0, 0);
}

// ── LOAD ──
async function loadWeek() {
  document.getElementById('taskWrap').innerHTML = '<div class="spin-wrap"><div class="spin"></div></div>';
  const from = toISO(weekMonday);
  const to = toISO(weekEnd(weekMonday));
  try {
    const r = await fetch(`${apiUrl()}&from=${from}&to=${to}`, { headers: apiHeaders() });
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    const d = await r.json();
    allTasks = d.tasks || [];
    renderWeekStrip(); // update dots
    renderTasks();
  } catch(e) {
    document.getElementById('taskWrap').innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div>
       <div class="empty-title">Ошибка</div>
       <div class="empty-sub">${esc(e.message)}</div></div>`;
  }
}

// ── RENDER ──
function renderTasks() {
  const dayTasks = allTasks.filter(t => t.day === selectedDay);
  const d = new Date(selectedDay + 'T00:00:00');
  const dateStr = d.toLocaleDateString('ru-RU', {weekday:'long',day:'numeric',month:'long'});

  const pending = dayTasks.filter(t => !t.done);
  const done = dayTasks.filter(t => t.done);

  let html = `<div class="day-header"><span class="day-header-title">${dateStr}</span></div>`;

  if (dayTasks.length === 0) {
    html += `<div class="empty">
      <div class="empty-icon">✨</div>
      <div class="empty-title">Нет задач</div>
      <div class="empty-sub">Напиши планы внизу или голосом через бота</div>
    </div>`;
  } else {
    const rows = (list) => list.map(t => `
      <div class="task-row">
        <button class="check${t.done?' on':''}" onclick="toggleDone(${t.id},${t.done})">
          <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
            <path d="M1 5l3.5 3.5L11 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="task-body">
          <div class="task-txt${t.done?' done':''}">${esc(t.text)}</div>
          ${t.time ? `<div class="task-time">${t.time}</div>` : ''}
        </div>
        <div class="task-actions">
          <button class="act-btn edit" onclick="openEdit(${t.id})" title="Редактировать">✎</button>
          <button class="act-btn del" onclick="openDelete(${t.id})" title="Удалить">✕</button>
        </div>
      </div>`).join('');

    if (pending.length > 0) {
      html += `<div class="task-list">${rows(pending)}</div>`;
    }
    if (done.length > 0) {
      html += `<div class="task-list" style="opacity:.6">${rows(done)}</div>`;
    }
  }

  document.getElementById('taskWrap').innerHTML = html;
}

// ── TOGGLE DONE ──
async function toggleDone(id, isDone) {
  if (navigator.vibrate) navigator.vibrate(8);
  allTasks = allTasks.map(t => t.id === id ? {...t, done: !isDone} : t);
  renderTasks();
  try {
    await fetch(apiUrl(), {
      method: 'PATCH',
      headers: apiHeaders(),
      body: JSON.stringify({ task_id: id, done: !isDone })
    });
  } catch { await loadWeek(); }
}

// ── EDIT ──
function openEdit(id) {
  editingId = id;
  const task = allTasks.find(t => t.id === id);
  if (!task) return;
  document.getElementById('editText').value = task.text;
  document.getElementById('editTime').value = task.time || '';
  buildDayPicker('editDayPicker', task.day);
  document.getElementById('editOverlay').classList.remove('hidden');
}

function closeEdit(e) {
  if (e.target === document.getElementById('editOverlay'))
    document.getElementById('editOverlay').classList.add('hidden');
}

function buildDayPicker(containerId, currentDay) {
  const days = weekDays(weekMonday);
  const names = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  document.getElementById(containerId).innerHTML = days.map((d, i) => {
    const iso = toISO(d);
    return `<button class="day-chip${iso === currentDay ? ' active' : ''}"
      onclick="selectChip(this,'${containerId}','${iso}')">
      ${names[i]} ${d.getDate()}
    </button>`;
  }).join('');
}

function selectChip(el, containerId, iso) {
  document.querySelectorAll(`#${containerId} .day-chip`).forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function getSelectedChip(containerId) {
  return document.querySelector(`#${containerId} .day-chip.active`)?.dataset?.iso
    || document.querySelector(`#${containerId} .day-chip.active`)?.onclick?.toString().match(/'(\d{4}-\d{2}-\d{2})'/)?.[1]
    || null;
}

function getActiveChipDay(containerId) {
  const el = document.querySelector(`#${containerId} .day-chip.active`);
  if (!el) return null;
  const m = el.getAttribute('onclick').match(/'(\d{4}-\d{2}-\d{2})'/);
  return m ? m[1] : null;
}

async function saveEdit() {
  const text = document.getElementById('editText').value.trim();
  if (!text) { showToast('Введи название задачи'); return; }
  const time = document.getElementById('editTime').value || null;
  const day = getActiveChipDay('editDayPicker');
  const updates = { task_id: editingId, text, time };
  if (day) updates.day = day;

  document.getElementById('editOverlay').classList.add('hidden');
  allTasks = allTasks.map(t => t.id === editingId ? {...t, text, time: time, day: day || t.day} : t);
  renderTasks();

  try {
    await fetch(apiUrl(), { method: 'PATCH', headers: apiHeaders(), body: JSON.stringify(updates) });
    await loadWeek();
  } catch { showToast('Ошибка сохранения'); await loadWeek(); }
}

// ── DELETE ──
function openDelete(id) {
  deletingId = id;
  const task = allTasks.find(t => t.id === id);
  document.getElementById('deleteTaskText').textContent = task?.text || '';
  document.getElementById('deleteOverlay').classList.remove('hidden');
}

function closeDelete(e) {
  if (e.target === document.getElementById('deleteOverlay'))
    document.getElementById('deleteOverlay').classList.add('hidden');
}

async function confirmDelete() {
  document.getElementById('deleteOverlay').classList.add('hidden');
  allTasks = allTasks.filter(t => t.id !== deletingId);
  renderTasks(); renderWeekStrip();
  try {
    await fetch(apiUrl(), { method: 'DELETE', headers: apiHeaders(), body: JSON.stringify({ task_id: deletingId }) });
  } catch { await loadWeek(); }
  showToast('Задача удалена');
}

// ── ADD ──
async function addTasks() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = '';
  document.getElementById('sendBtn').disabled = true;
  showToast('Обрабатываю...');
  try {
    const r = await fetch(apiUrl(), {
      method: 'POST',
      headers: apiHeaders(),
      body: JSON.stringify({ text, day: selectedDay })
    });
    const d = await r.json();
    await loadWeek();
    showToast(d.added > 0 ? `Добавлено: ${d.added} задач` : 'Не удалось распознать задачи');
  } catch { showToast('Ошибка. Попробуй ещё раз.'); }
  finally { document.getElementById('sendBtn').disabled = false; }
}

// ── HELPERS ──
function grow(el) { el.style.height = ''; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
function onKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addTasks(); } }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

init();
</script>
</body>
</html>
