<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Планировщик</title>
<style>
:root {
  --blue: #007AFF; --green: #34C759; --red: #FF3B30; --orange: #FF9500;
  --bg: #F2F2F7; --card: #FFFFFF; --card2: #F2F2F7;
  --t1: #000; --t2: rgba(60,60,67,.6); --t3: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.12); --fill: rgba(120,120,128,.12);
  --r: 16px; --r2: 12px;
  --si-top: env(safe-area-inset-top,44px);
  --si-bot: env(safe-area-inset-bottom,34px);
}
@media(prefers-color-scheme:dark){:root{
  --blue:#0A84FF; --green:#30D158; --red:#FF453A;
  --bg:#000; --card:#1C1C1E; --card2:#2C2C2E;
  --t1:#fff; --t2:rgba(235,235,245,.6); --t3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24);
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased}

/* ── SETUP ── */
.setup{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:100;animation:fadeIn .3s}
.setup-box{background:var(--card);border-radius:28px;padding:36px 24px;width:100%;max-width:390px}
.setup-emoji{font-size:64px;text-align:center;margin-bottom:20px;line-height:1}
.setup-title{font-size:28px;font-weight:700;letter-spacing:-.5px;text-align:center;margin-bottom:8px}
.setup-desc{font-size:15px;color:var(--t2);text-align:center;line-height:1.5;margin-bottom:32px}
.field-label{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:8px}
.field-input{width:100%;background:var(--fill);border:none;border-radius:var(--r2);
  padding:14px 16px;font-size:17px;font-family:inherit;color:var(--t1);outline:none;
  transition:background .15s;margin-bottom:6px}
.field-input:focus{background:var(--sep)}
.field-hint{font-size:13px;color:var(--t3);margin-bottom:24px;padding:0 4px}
.btn{width:100%;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:600;
  font-family:inherit;cursor:pointer;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.98);opacity:.88}
.btn-blue{background:var(--blue);color:#fff}
.btn-sm{border-radius:10px;padding:10px 20px;font-size:15px;width:auto}

/* ── APP SHELL ── */
.app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ── HEADER ── */
.hdr{
  padding:calc(var(--si-top) + 10px) 20px 12px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(var(--bg-rgb,242,242,247),.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  position:relative;z-index:10;border-bottom:.5px solid var(--sep)
}
.hdr-date{font-size:13px;font-weight:500;color:var(--t2);text-transform:capitalize}
.hdr-center{font-size:17px;font-weight:600}
.hdr-btn{background:none;border:none;color:var(--blue);font-size:15px;font-family:inherit;
  cursor:pointer;padding:6px;border-radius:8px}
.hdr-btn:active{background:var(--fill)}

/* ── SCROLL ── */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--si-bot) + 84px)}
.scroll::-webkit-scrollbar{display:none}

/* ── HERO CARD ── */
.hero{margin:16px 16px 0;border-radius:24px;padding:24px 24px 20px;
  background:linear-gradient(135deg,#0066FF 0%,#5E5CE6 100%);
  color:#fff;position:relative;overflow:hidden}
@media(prefers-color-scheme:dark){
  .hero{background:linear-gradient(135deg,#0A84FF 0%,#5E5CE6 100%)}
}
.hero-blob1{position:absolute;top:-50px;right:-50px;width:180px;height:180px;
  background:rgba(255,255,255,.12);border-radius:50%;pointer-events:none}
.hero-blob2{position:absolute;bottom:-70px;right:10px;width:220px;height:220px;
  background:rgba(255,255,255,.07);border-radius:50%;pointer-events:none}
.hero-greeting{font-size:24px;font-weight:700;letter-spacing:-.4px;position:relative}
.hero-date{font-size:14px;opacity:.75;margin-top:2px;margin-bottom:20px;position:relative}
.progress-track{background:rgba(255,255,255,.25);border-radius:100px;height:5px;
  overflow:hidden;margin-bottom:8px;position:relative}
.progress-fill{height:100%;background:#fff;border-radius:100px;
  transition:width .7s cubic-bezier(.34,1.56,.64,1);width:0%}
.hero-stats{font-size:13px;opacity:.8;position:relative}

/* ── SECTIONS ── */
.sec{margin:20px 16px 0}
.sec-hdr{font-size:13px;font-weight:600;color:var(--t2);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:10px;padding:0 4px}

/* ── TASK LIST ── */
.task-list{background:var(--card);border-radius:var(--r);overflow:hidden}
.task-row{display:flex;align-items:center;padding:14px 16px;gap:14px;cursor:pointer;
  position:relative;transition:background .15s}
.task-row:not(:last-child)::after{content:'';position:absolute;bottom:0;left:54px;right:0;
  height:.5px;background:var(--sep)}
.task-row:active{background:var(--fill)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--sep);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.check.on{background:var(--green);border-color:var(--green)}
.check svg{width:13px;height:13px;opacity:0;transform:scale(0);
  transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.check.on svg{opacity:1;transform:scale(1)}
.task-body{flex:1;min-width:0}
.task-txt{font-size:17px;line-height:1.35;transition:color .2s;word-break:break-word}
.task-txt.done{color:var(--t3);text-decoration:line-through}
.task-time{font-size:13px;color:var(--blue);font-weight:500;margin-top:2px}

/* ── EMPTY ── */
.empty{padding:48px 20px;text-align:center}
.empty-icon{font-size:52px;margin-bottom:16px}
.empty-ttl{font-size:20px;font-weight:600;margin-bottom:8px}
.empty-sub{font-size:15px;color:var(--t2);line-height:1.5}

/* ── BOTTOM BAR ── */
.bar{position:fixed;bottom:0;left:0;right:0;z-index:10;
  padding:10px 16px calc(var(--si-bot) + 10px);
  background:rgba(var(--bg-rgb,242,242,247),.9);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:.5px solid var(--sep)}
.bar-row{display:flex;gap:10px;align-items:flex-end}
.bar-input{flex:1;background:var(--fill);border:none;border-radius:22px;
  padding:10px 16px;font-size:17px;font-family:inherit;color:var(--t1);
  outline:none;resize:none;max-height:120px;min-height:44px;line-height:1.4}
.bar-input::placeholder{color:var(--t3)}
.send{width:44px;height:44px;border-radius:50%;background:var(--blue);border:none;
  color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;transition:transform .1s,opacity .1s}
.send:active{transform:scale(.9);opacity:.85}
.send:disabled{background:var(--fill);color:var(--t3)}

/* ── SPINNER ── */
.spin-wrap{display:flex;justify-content:center;padding:48px}
.spin{width:30px;height:30px;border:2.5px solid var(--sep);border-top-color:var(--blue);
  border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--si-bot) + 92px);left:50%;
  transform:translateX(-50%);background:rgba(40,40,40,.92);color:#fff;
  padding:10px 22px;border-radius:100px;font-size:15px;font-weight:500;
  z-index:200;white-space:nowrap;transition:opacity .25s,transform .25s;
  backdrop-filter:blur(12px)}
.toast.off{opacity:0;transform:translateX(-50%) translateY(8px);pointer-events:none}

/* ── UTIL ── */
.hidden{display:none!important}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.slide-up{animation:slideUp .35s cubic-bezier(.34,1.2,.64,1) both}
</style>
</head>
<body>

<!-- SETUP -->
<div class="setup" id="setup">
  <div class="setup-box">
    <div class="setup-emoji">🌅</div>
    <h1 class="setup-title">Планировщик</h1>
    <p class="setup-desc">Твои задачи на день — красиво и под рукой</p>

    <div class="field-label">Telegram ID</div>
    <input class="field-input" id="uidIn" type="number" inputmode="numeric"
      placeholder="123456789" onkeydown="if(event.key==='Enter')doSetup()">
    <p class="field-hint">Отправь /myid боту, чтобы узнать свой ID</p>

    <button class="btn btn-blue" onclick="doSetup()">Войти</button>
  </div>
</div>

<!-- APP -->
<div class="app hidden" id="app">
  <div class="hdr">
    <div class="hdr-date" id="hdrDate"></div>
    <div class="hdr-center">Задачи</div>
    <button class="hdr-btn" onclick="load()">Обновить</button>
  </div>

  <div class="scroll">
    <!-- Hero -->
    <div class="hero slide-up">
      <div class="hero-blob1"></div>
      <div class="hero-blob2"></div>
      <div class="hero-greeting" id="greeting"></div>
      <div class="hero-date" id="heroDate"></div>
      <div class="progress-track"><div class="progress-fill" id="pFill"></div></div>
      <div class="hero-stats" id="hStats"></div>
    </div>

    <!-- Tasks -->
    <div class="sec">
      <div class="sec-hdr">На сегодня</div>
      <div id="taskWrap"><div class="spin-wrap"><div class="spin"></div></div></div>
    </div>
  </div>

  <div class="bar">
    <div class="bar-row">
      <textarea class="bar-input" id="inp" placeholder="Добавить задачи..." rows="1"
        oninput="grow(this)" onkeydown="onKey(event)"></textarea>
      <button class="send" id="sendBtn" onclick="addTasks()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 20V4M4 12l8-8 8 8" stroke="white" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div class="toast off" id="toast"></div>

<script>
let uid = null, tasks = [];
const API = '/api/webapp';

function init() {
  uid = localStorage.getItem('tg_uid');
  if (uid) { show('app'); updateMeta(); load(); }
  else show('setup');
}

function show(id) {
  ['setup','app'].forEach(x => document.getElementById(x).classList.toggle('hidden', x !== id));
}

function doSetup() {
  const v = document.getElementById('uidIn').value.trim();
  if (!v || isNaN(+v)) { showToast('Введи числовой Telegram ID'); return; }
  uid = v;
  localStorage.setItem('tg_uid', uid);
  show('app');
  updateMeta();
  load();
}

function updateMeta() {
  const now = new Date();
  const h = now.getHours();
  const greets = [[5,12,'Доброе утро 🌅'],[12,18,'Добрый день ☀️'],
                  [18,22,'Добрый вечер 🌆'],[0,5,'Доброй ночи 🌙']];
  const g = greets.find(([f,t]) => h >= f && h < t) || greets[3];
  document.getElementById('greeting').textContent = g[2];

  const d = now.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('hdrDate').textContent = d;
  document.getElementById('heroDate').textContent = d;
}

async function load() {
  document.getElementById('taskWrap').innerHTML =
    '<div class="spin-wrap"><div class="spin"></div></div>';
  try {
    const r = await fetch(`${API}?uid=${uid}`);
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    const d = await r.json();
    tasks = d.tasks || [];
    render();
  } catch(e) {
    document.getElementById('taskWrap').innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div>
       <div class="empty-ttl">Ошибка</div>
       <div class="empty-sub">${e.message}</div></div>`;
  }
}

function render() {
  const done = tasks.filter(t => t.done).length;
  const total = tasks.length;
  const pct = total ? done/total*100 : 0;
  document.getElementById('pFill').style.width = pct + '%';
  document.getElementById('hStats').textContent =
    total ? `${done} из ${total} выполнено` : 'Нет задач';

  if (!total) {
    document.getElementById('taskWrap').innerHTML =
      `<div class="empty">
        <div class="empty-icon">✨</div>
        <div class="empty-ttl">Всё чисто</div>
        <div class="empty-sub">Напиши свои планы внизу<br>или голосом через бота</div>
      </div>`;
    return;
  }

  const pending = tasks.filter(t=>!t.done);
  const finished = tasks.filter(t=>t.done);
  const list = [...pending,...finished];

  document.getElementById('taskWrap').innerHTML =
    `<div class="task-list slide-up">${list.map(t=>`
      <div class="task-row" onclick="toggle(${t.id},${t.done})">
        <div class="check ${t.done?'on':''}">
          <svg viewBox="0 0 13 13" fill="none">
            <path d="M1.5 6.5l3.5 3.5 6.5-7" stroke="white" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="task-body">
          <div class="task-txt${t.done?' done':''}">${esc(t.text)}</div>
          ${t.time?`<div class="task-time">${t.time}</div>`:''}
        </div>
      </div>`).join('')}</div>`;
}

async function toggle(id, isDone) {
  if (isDone) return;
  if (navigator.vibrate) navigator.vibrate(8);
  tasks = tasks.map(t => t.id===id ? {...t,done:true} : t);
  render();
  try {
    const r = await fetch(`${API}?uid=${uid}`,{
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({task_id:id})
    });
    const d = await r.json();
    tasks = d.tasks || tasks;
    render();
  } catch { await load(); }
}

async function addTasks() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value=''; inp.style.height='';
  document.getElementById('sendBtn').disabled = true;
  showToast('Обрабатываю...');
  try {
    const r = await fetch(`${API}?uid=${uid}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text})
    });
    const d = await r.json();
    tasks = d.tasks || tasks;
    render();
    showToast(d.added>0
      ? `Добавлено ${d.added} ${plur(d.added,'задача','задачи','задач')}`
      : 'Не удалось распознать задачи');
  } catch { showToast('Ошибка. Попробуй ещё раз.'); }
  finally { document.getElementById('sendBtn').disabled=false; }
}

function grow(el) {
  el.style.height=''; el.style.height = Math.min(el.scrollHeight,120)+'px';
}
function onKey(e) {
  if (e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); addTasks(); }
}
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function plur(n,a,b,c) {
  const m=n%10, h=n%100;
  if(m===1&&h!==11) return a;
  if([2,3,4].includes(m)&&![12,13,14].includes(h)) return b;
  return c;
}
let _tt;
function showToast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.remove('off');
  clearTimeout(_tt); _tt=setTimeout(()=>el.classList.add('off'),2600);
}

init();
</script>
</body>
</html>
